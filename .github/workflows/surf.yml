name: Publish surf cards

# The cards are now BUILT on Amanda's computer (refresh_surf.ps1), because Surfline blocks GitHub's servers (HTTP 403).
# This workflow only publishes whatever was pushed to surf-live/site. It never contacts Surfline.

on:
  push:
    branches: [main]
    paths:
      - "surf-live/site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: surf-live/site
      # GitHub sometimes can't "see" the just-uploaded artifact yet
      # ("No artifacts named github-pages were found"). If that happens,
      # wait a bit and try the deploy once more instead of failing.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
